# .github/workflows/ci.yml
#
# CI PIPELINE (build + test + docker build - deploy & slack commented)
# ---------------------------------------------------------------------
# Adds a real PostgreSQL service container so Prisma has a database
# to run migrations against during CI. If your tests are fully
# mocked and never touch the DB, this container just sits idle —
# no harm, but it's there and ready the moment you add a real
# integration/e2e test.
#
# AWS deploy + Slack notify are stubbed and commented - uncomment when ready:
# - AWS: ECR push + ECS deploy (needs AWS_ROLE_TO_ASSUME / secrets)
# - Slack: slackapi/slack-github-action notification

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # JOB 1: Install deps, run Prisma migrations against a throwaway
  # Postgres container, then run tests.
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    # `services:` spins up an extra container alongside the job's
    # main container, on the same Docker network. It's created fresh
    # for this job run and destroyed afterward — a clean, disposable
    # test database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Waits for Postgres to actually be ready to accept connections
        # before the job's steps start — avoids a race condition where
        # `prisma migrate` runs before the DB has finished booting.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # This env var is what Prisma reads to know where to connect.
    # It points at "localhost" because the service container's ports
    # are mapped onto the job runner's own network namespace.
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Applies your existing migration files to the fresh test DB.
      # This is `migrate deploy` (not `migrate dev`) — it just applies
      # migrations that already exist, it never generates new ones,
      # which is exactly what you want in CI.
      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

      # This runs test/app.e2e-spec.ts and any other *.e2e-spec.ts files.
      # It boots the full AppModule, so it needs the Postgres service
      # above and the DATABASE_URL env var to already be in place —
      # which is exactly why they were added earlier.
      - name: Run e2e tests
        run: npm run test:e2e

  # ---------------------------------------------------------------
  # JOB 2: Confirm the Docker image builds successfully.
  # `needs: test` — don't bother building an image for code whose
  # tests just failed.
  # ---------------------------------------------------------------
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `push: false` — just proves the image builds. Nothing is
      # uploaded anywhere yet.
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: my-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

